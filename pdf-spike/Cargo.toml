# G3 PDF-backend spike (typst vs genpdf). Detached from the XyScript workspace
# (its own empty [workspace]) so the heavy deps never touch the app's lockfile.
[package]
name = "pdf-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
genpdf = "0.2"
typst = "0.14.2"
typst-as-lib = "0.15.5"
typst-pdf = "0.14.2"
# Bundled fonts (New Computer Modern + its math face, DejaVu mono) so the demo
# renders math and the default font without depending on Windows fonts.
typst-assets = { version = "0.14.2", features = ["fonts"] }

[workspace]
