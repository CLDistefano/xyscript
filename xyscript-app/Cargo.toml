[package]
name = "xyscript-app"
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
description = "XyScript Stage 2: the closed editing loop — wires the keyboard resolver, the XPL interpreter, and a minimal text engine into an editor."
license = "MIT OR Apache-2.0"

[lib]
name = "xyscript_app"
path = "src/lib.rs"

[[bin]]
name = "xyscript"
path = "src/main.rs"

# The app is the integration layer: it depends on both the keyboard layer and
# the interpreter and implements the interpreter's `Host` trait against a real
# text engine.
[dependencies]
xyscript-kbd = { path = "../xyscript-kbd" }
xyscript-xpl = { path = "../xyscript-xpl" }
# Stage 3 D1: the text engine is a rope. `ropey` gives O(log n) edits and
# char/byte/line indexing — chosen for 100–300MB files (see beyond-stage2-plan.md).
ropey = "1"
# B1 search: the `regex` crate backs the `/R` regex search flag (literal search is
# hand-rolled in text.rs; regex is opt-in per command).
regex = "1"
# `/P` search: a Perl-compatible engine (lookaround, backreferences, atomic groups) for FIND/SE/CH,
# opt-in per command. `fancy-regex` is pure Rust — it uses the `regex` crate above for the fast path
# and a backtracking VM (with a step limit, so a pathological pattern fails instead of hanging) only
# for the fancy features. The linear-time `regex` engine stays the default; `/P` is the opt-in.
fancy-regex = "0.14"
# GREP (built-in ripgrep-style search): the ripgrep libraries. `grep-regex` wraps the SAME
# `regex` crate above (identical pattern semantics to FIND/EMPH/HLRULE); `grep-searcher` gives
# line/column reporting + binary-file skipping + big-file handling; `ignore` is the recursive
# walker that respects `.gitignore`/hidden. See grep.rs.
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
# Stage 3 step 6: the provisional TUI shell. `crossterm` provides terminal size,
# cursor placement, and conhost/VT compatibility (generic terminal infra; only
# the binary uses it — the lib's viewport math is dependency-free).
crossterm = "0.28"
# GFM step 8 (G1): comrak — pure-Rust cmark-gfm port — for parsing GFM to an AST
# (source highlighting now via sourcepos; the render-model layout later). Default
# features (CLI + syntect) pull in deps needing a newer rustc and aren't needed —
# we walk the AST ourselves — so they're disabled.
comrak = { version = "0.49.0", default-features = false }
# GFM step 8c (G3): typst — the typesetting engine that renders GFM (via the
# typst markup from `gfm.rs`) to PDF (and later SVG/raster for the GUI preview).
# `typst-as-lib` wraps the embedding (World/fonts); `typst-assets` bundles the
# default fonts so output is portable + license-clean (no system-font dependency).
typst = "0.14.2"
typst-as-lib = "0.15.5"
typst-pdf = "0.14.2"
typst-render = "0.14.2" # GFM → raster for the GUI live preview (8d)
typst-assets = { version = "0.14.2", features = ["fonts"] }
# HTML → typst markup (`html.rs`), for `DOCTYPE html` preview/print and for rendering the raw-HTML
# blocks GFM allows. `html5ever` is the spec-compliant HTML5 parser — it recovers from the malformed
# real-world markup (unclosed tags, stray `<`) that a hand-rolled parser would choke on; it is ALREADY
# compiled in the `lint` build as a transitive dep of harper-core (via ammonia), so it costs little
# there. `markup5ever_rcdom` is its reference DOM sink — html5ever itself only provides the tokenizer
# and the `TreeSink` trait, not a tree to walk.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# Language checking — behind the OPTIONAL `lint` feature (below). harper-core is a pure-Rust, fully
# offline grammar/spell checker. NOT lightweight: its neural POS tagger pulls in `burn` (an ML
# framework, CPU/ndarray backend — no GPU) as a REQUIRED transitive dep, adding ~14 MB to the binary
# and several minutes to a clean build. `harper-typst` (prose-aware Typst parser) rides on
# typst-syntax, which we already have. Edition-2024 crates; need rustc ≥ 1.85. Off by default so
# normal dev/test builds stay lean; the distributable is built with `--features lint`.
harper-core = { version = "2.7", optional = true }
harper-typst = { version = "2.7", optional = true }
# System-font lookup for the user-selectable Preview/TOPDF font (resolve a chosen family name to
# the face bytes we hand Typst). Matches the version cosmic-text already pulls in.
fontdb = "0.23"

# Unix only: read the local UTC offset (DST-aware) from `localtime_r`'s `tm_gmtoff` for the date/time
# specials ($MDAY/$DA/…) and DIR file times. Windows uses `GetTimeZoneInformation` (hand-rolled FFI,
# no crate); hand-declaring `struct tm` is unwise (layout differs across macOS/glibc/musl), so on Unix
# we lean on the ubiquitous `libc`. See `dir::system_local_offset_secs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Compile in the harper-backed language checker (the `CHECK` verb, live underlines). Adds the burn
# ML dependency — see the note on `harper-core` above.
lint = ["dep:harper-core", "dep:harper-typst"]
# Compile in the email verbs (`SENDMAIL` + SMTP config), which shell out to `curl`. Off by default and
# NOT in the distributable tester build — a personal "email edition" is built with `--features email`.
email = ["xyscript-xpl/email"]
