name: Build binaries

# Produces native XyScript GUI binaries per platform. Linux + Windows build on their own runners;
# macOS builds a single UNIVERSAL binary (Intel + Apple Silicon) on the Apple-Silicon runner, whose
# Xcode SDK can also cross-compile x86_64 — GitHub's Intel (macos-13) runners are being retired and
# often never get allocated, so we don't depend on one. Triggered manually, or on a version tag
# (`git tag v0.1.0 && git push --tags`) which also attaches the per-platform bundles (binary + UI
# translation catalogs) to a Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Drift gate: the committed UI catalogs (docs/i18n/*.lang) must stay in sync with the
  # tr()/tr_msg()/tr_fmt() strings in the code, or the bundled translations would ship stale.
  # `i18n-sync --check` exits nonzero on any drift or unreviewed `#, fuzzy` entry. Gates the builds.
  i18n-check:
    name: UI catalogs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify docs/i18n catalogs match the code
        run: python docs/i18n/i18n-sync.py --check

  build:
    name: ${{ matrix.name }}
    needs: i18n-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: xyscript-gui
            exe: xyscript
            artifact: xyscript-linux-x86_64
          - os: windows-latest
            name: windows-x86_64
            bin: xyscript-gui.exe
            exe: xyscript.exe
            artifact: xyscript-windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `xyscript-gui` is a detached workspace, so its build tree lives under xyscript-gui/target.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xyscript-gui

      # winit (X11/Wayland), wgpu (GL/Vulkan), rfd (portal/GTK), arboard, cosmic-text/fontconfig all
      # need their dev headers on Linux. Windows gets everything from the SDK.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev

      # Build from INSIDE xyscript-gui so its .cargo/config.toml applies (static MSVC CRT on Windows).
      # `lint` = language checker, `email` = mail verbs — the same feature set as the shipped dist.
      - name: Build (release, lint + email)
        working-directory: xyscript-gui
        run: cargo build --release --features lint,email

      # Bundle the binary with everything the app discovers at runtime beside it (`$XSDIR`): the UI
      # translation catalogs (`lang/*.lang` → `Settings ▸ Language`), the colour-theme presets
      # (`themes/*.xpl` → `Settings ▸ Appearance ▸ Theme`), and the runtime kit from `packaging/runtime/`
      # — a working `startup.xpl` (loads the keymap, default config, a theme, auto-replace pairs, and the
      # user library), the `xyscript-internal.kbd` keymap, `xyscript-default.cfg` (all settings at their
      # defaults), `xyscript.ar`, `xyscript.lib`, plus `startup.xpl.template` and `user-variables.template`
      # for the user to copy and edit. Because a GUI boot sets `$CWD` to `$XSDIR`, the unzipped folder is
      # self-contained: those relative loads resolve here, so it runs out of the box. English is built in
      # and the pseudolocale is a dev-only layout aid, so neither `.lang` ships.
      - name: Package (binary + language catalogs + themes + runtime kit)
        shell: bash
        run: |
          pkg="staged/${{ matrix.artifact }}"
          mkdir -p "$pkg/lang" "$pkg/themes" "$pkg/examples" "$pkg/grammars" "$pkg/docs"
          cp "xyscript-gui/target/release/${{ matrix.bin }}" "$pkg/${{ matrix.exe }}"
          cp docs/i18n/*.lang "$pkg/lang/"
          cp themes/*.xpl "$pkg/themes/"
          cp packaging/runtime/* "$pkg/"
          cp examples/* "$pkg/examples/"
          cp grammars/*.xpl "$pkg/grammars/"
          cp docs/manual.pdf docs/reference.pdf docs/keyboard.png docs/email.md docs/regex.md docs/run-commands.md "$pkg/docs/"
          rm -f "$pkg/lang/en.lang" "$pkg/lang/pseudo.lang"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staged/${{ matrix.artifact }}
          if-no-files-found: error

  # One macOS binary for BOTH architectures. The Apple-Silicon runner (macos-14) builds its native
  # arm64 plus a cross-compiled x86_64, then `lipo` merges them into a universal executable.
  macos:
    name: macos-universal
    needs: i18n-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xyscript-gui

      - name: Build both architectures (release, lint + email)
        working-directory: xyscript-gui
        run: |
          cargo build --release --features lint,email --target aarch64-apple-darwin
          cargo build --release --features lint,email --target x86_64-apple-darwin

      - name: Package (universal binary + language catalogs + themes + runtime kit)
        shell: bash
        run: |
          pkg="staged/xyscript-macos-universal"
          mkdir -p "$pkg/lang" "$pkg/themes" "$pkg/examples" "$pkg/grammars" "$pkg/docs"
          lipo -create -output "$pkg/xyscript" \
            xyscript-gui/target/aarch64-apple-darwin/release/xyscript-gui \
            xyscript-gui/target/x86_64-apple-darwin/release/xyscript-gui
          lipo -info "$pkg/xyscript"
          cp docs/i18n/*.lang "$pkg/lang/"
          rm -f "$pkg/lang/en.lang" "$pkg/lang/pseudo.lang"
          cp themes/*.xpl "$pkg/themes/"
          cp packaging/runtime/* "$pkg/"
          cp examples/* "$pkg/examples/"
          cp grammars/*.xpl "$pkg/grammars/"
          cp docs/manual.pdf docs/reference.pdf docs/keyboard.png docs/email.md docs/regex.md docs/run-commands.md "$pkg/docs/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xyscript-macos-universal
          path: staged/xyscript-macos-universal
          if-no-files-found: error

  # On a version tag, gather every platform's bundle (binary + lang/), zip each, and attach to a Release.
  release:
    name: Publish release
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Each artifact is a platform bundle directory (binary + lang/). Zip each into one release asset
      # so the catalogs travel with the binary (ubuntu runners ship `zip`).
      - name: Zip each platform bundle
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -r "../$name.zip" "$name"
          done
          cd ..
          ls -la *.zip

      - name: Attach bundles to the release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
          fail_on_unmatched_files: true
