name: Build binaries

# Produces native XyScript GUI binaries per platform. Linux + Windows build on their own runners;
# macOS builds a single UNIVERSAL binary (Intel + Apple Silicon) on the Apple-Silicon runner, whose
# Xcode SDK can also cross-compile x86_64 — GitHub's Intel (macos-13) runners are being retired and
# often never get allocated, so we don't depend on one. Triggered manually, or on a version tag
# (`git tag v0.1.0 && git push --tags`) which also attaches the per-platform bundles (binary + UI
# translation catalogs) to a Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Drift gate: the committed UI catalogs (docs/i18n/*.lang) must stay in sync with the
  # tr()/tr_msg()/tr_fmt() strings in the code, or the bundled translations would ship stale.
  # `i18n-sync --check` exits nonzero on any drift or unreviewed `#, fuzzy` entry. Gates the builds.
  i18n-check:
    name: UI catalogs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify docs/i18n catalogs match the code
        run: python docs/i18n/i18n-sync.py --check

  build:
    name: ${{ matrix.name }}
    needs: i18n-check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach the bundle straight to the Release (see the zip/attach steps below)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: xyscript-gui
            exe: xyscript
            artifact: xyscript-linux-x86_64
          - os: windows-latest
            name: windows-x86_64
            bin: xyscript-gui.exe
            exe: xyscript.exe
            artifact: xyscript-windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `xyscript-gui` is a detached workspace, so its build tree lives under xyscript-gui/target.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xyscript-gui

      # winit (X11/Wayland), wgpu (GL/Vulkan), rfd (portal/GTK), arboard, cosmic-text/fontconfig all
      # need their dev headers on Linux. Windows gets everything from the SDK.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev

      # Build from INSIDE xyscript-gui so its .cargo/config.toml applies (static MSVC CRT on Windows).
      # `lint` = language checker, `email` = mail verbs — the same feature set as the shipped dist.
      - name: Build (release, lint + email)
        working-directory: xyscript-gui
        run: cargo build --release --features lint,email

      # Bundle the binary with everything the app discovers at runtime beside it (`$XSDIR`): the UI
      # translation catalogs (`lang/*.lang` → `Settings ▸ Language`), the colour-theme presets
      # (`themes/*.xpl` → `Settings ▸ Appearance ▸ Theme`), and the runtime kit from `packaging/runtime/`
      # — a working `startup.xpl` (loads the keymap, default config, a theme, auto-replace pairs, and the
      # user library), the `xyscript-internal.kbd` keymap, `xyscript-default.cfg` (all settings at their
      # defaults), `xyscript.ar`, `xyscript.lib`, plus `startup.xpl.template` and `user-variables.template`
      # for the user to copy and edit. Because a GUI boot sets `$CWD` to `$XSDIR`, the unzipped folder is
      # self-contained: those relative loads resolve here, so it runs out of the box. English is built in
      # and the pseudolocale is a dev-only layout aid, so neither `.lang` ships.
      - name: Package (binary + language catalogs + themes + runtime kit)
        shell: bash
        run: |
          pkg="staged/${{ matrix.artifact }}"
          mkdir -p "$pkg/lang" "$pkg/themes" "$pkg/examples" "$pkg/grammars" "$pkg/templates" "$pkg/docs"
          cp "xyscript-gui/target/release/${{ matrix.bin }}" "$pkg/${{ matrix.exe }}"
          # Pin the binary executable in the archive (belt-and-suspenders: cargo already emits 0755,
          # but keep a future packaging change from silently dropping it). No-op on Windows.
          if [ "$RUNNER_OS" != "Windows" ]; then chmod 755 "$pkg/${{ matrix.exe }}"; fi
          cp docs/i18n/*.lang "$pkg/lang/"
          cp themes/*.xpl "$pkg/themes/"
          cp packaging/runtime/* "$pkg/"
          cp examples/* "$pkg/examples/"
          cp grammars/*.xpl "$pkg/grammars/"
          cp templates/* "$pkg/templates/"
          cp docs/manual.pdf docs/reference.pdf docs/keyboard.png docs/email.md docs/regex.md docs/run-commands.md "$pkg/docs/"
          rm -f "$pkg/lang/en.lang" "$pkg/lang/pseudo.lang"

      # The colour-emoji font. The app loads any face in `fonts/` beside the exe (`$XSDIR/fonts`), and
      # the bundled typst_assets set has no emoji glyphs — so without this, emoji print as .notdef boxes
      # in TOPDF/TOSVG/preview. Fetched at build time (it is ~24 MB, deliberately NOT committed to the
      # repo). Tracks google/fonts `main`; `-f` fails on an HTTP error and the size check fails on a
      # success-with-wrong-content (e.g. a redirected error page), so a release never silently ships a
      # broken font.
      - name: Fetch the colour-emoji font
        shell: bash
        run: |
          dest="staged/${{ matrix.artifact }}/fonts/NotoColorEmoji-Regular.ttf"
          mkdir -p "$(dirname "$dest")"
          curl -fsSL --retry 3 -o "$dest" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notocoloremoji/NotoColorEmoji-Regular.ttf"
          sz=$(wc -c < "$dest")
          if [ "$sz" -lt 1000000 ]; then echo "emoji font download looks wrong ($sz bytes)"; exit 1; fi
          echo "fetched NotoColorEmoji-Regular.ttf ($sz bytes)"

      # Zip the bundle, then attach it DIRECTLY to the Release (below). Release assets use separate,
      # effectively-unlimited storage — unlike the Actions artifact store, whose per-account quota was
      # blocking publishes once a few releases' build artifacts accumulated. So no intermediate
      # `upload-artifact` / `download-artifact` round-trip, and no quota to hit.
      - name: Zip bundle (Linux)
        if: runner.os == 'Linux'
        run: (cd staged && zip -r "../${{ matrix.artifact }}.zip" "${{ matrix.artifact }}")
      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "staged/${{ matrix.artifact }}" -DestinationPath "${{ matrix.artifact }}.zip"

      # ALSO ship a .tar.gz for Linux alongside the .zip: tar preserves the Unix exec bit through any
      # extractor, where a zip can lose it depending on the tool. Windows gets the .zip only.
      - name: Tar bundle (Linux)
        if: runner.os == 'Linux'
        run: (cd staged && tar czf "../${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}")

      - name: Attach bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Every archive built for this platform: the .zip on all runners, plus the .tar.gz on Linux.
          files: ${{ matrix.artifact }}.*
          fail_on_unmatched_files: true
          # Auto-populate the release body with GitHub's generated notes; a hand-edited body is
          # preserved on re-run (action-gh-release won't overwrite a non-empty body). The three build
          # jobs each upsert the same tag's Release and add their own asset.
          generate_release_notes: true

  # One macOS binary for BOTH architectures. The Apple-Silicon runner (macos-14) builds its native
  # arm64 plus a cross-compiled x86_64, then `lipo` merges them into a universal executable.
  macos:
    name: macos-universal
    needs: i18n-check
    runs-on: macos-14
    permissions:
      contents: write # attach the universal bundle straight to the Release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xyscript-gui

      - name: Build both architectures (release, lint + email)
        working-directory: xyscript-gui
        run: |
          cargo build --release --features lint,email --target aarch64-apple-darwin
          cargo build --release --features lint,email --target x86_64-apple-darwin

      - name: Package (universal binary + language catalogs + themes + runtime kit)
        shell: bash
        run: |
          pkg="staged/xyscript-macos-universal"
          mkdir -p "$pkg/lang" "$pkg/themes" "$pkg/examples" "$pkg/grammars" "$pkg/templates" "$pkg/docs"
          lipo -create -output "$pkg/xyscript" \
            xyscript-gui/target/aarch64-apple-darwin/release/xyscript-gui \
            xyscript-gui/target/x86_64-apple-darwin/release/xyscript-gui
          lipo -info "$pkg/xyscript"
          # Pin the universal binary executable in the archive (lipo output is 0755, but make it explicit).
          chmod 755 "$pkg/xyscript"
          cp docs/i18n/*.lang "$pkg/lang/"
          rm -f "$pkg/lang/en.lang" "$pkg/lang/pseudo.lang"
          cp themes/*.xpl "$pkg/themes/"
          cp packaging/runtime/* "$pkg/"
          cp examples/* "$pkg/examples/"
          cp grammars/*.xpl "$pkg/grammars/"
          cp templates/* "$pkg/templates/"
          cp docs/manual.pdf docs/reference.pdf docs/keyboard.png docs/email.md docs/regex.md docs/run-commands.md "$pkg/docs/"
          # First-run note at the bundle root: clearing Gatekeeper quarantine (unsigned app) + the exec bit.
          cp packaging/macos-first-run.txt "$pkg/MACOS-READ-ME-FIRST.txt"

      # Colour-emoji font — see the matching step in the `build` job. Fetched at build time (~24 MB, not
      # committed); without it, emoji print as .notdef boxes in TOPDF/TOSVG/preview.
      - name: Fetch the colour-emoji font
        shell: bash
        run: |
          dest="staged/xyscript-macos-universal/fonts/NotoColorEmoji-Regular.ttf"
          mkdir -p "$(dirname "$dest")"
          curl -fsSL --retry 3 -o "$dest" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notocoloremoji/NotoColorEmoji-Regular.ttf"
          sz=$(wc -c < "$dest")
          if [ "$sz" -lt 1000000 ]; then echo "emoji font download looks wrong ($sz bytes)"; exit 1; fi
          echo "fetched NotoColorEmoji-Regular.ttf ($sz bytes)"

      - name: Zip bundle
        run: (cd staged && zip -r "../xyscript-macos-universal.zip" "xyscript-macos-universal")

      # ALSO ship a .tar.gz alongside the .zip — tar preserves the exec bit through any extractor, so a
      # user who takes the tarball likely won't even need the `chmod +x` step from the first-run note.
      - name: Tar bundle
        run: (cd staged && tar czf "../xyscript-macos-universal.tar.gz" "xyscript-macos-universal")

      - name: Attach bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Both archives: the .zip (familiar to Finder users) and the .tar.gz (robust exec bit).
          files: xyscript-macos-universal.*
          fail_on_unmatched_files: true
          generate_release_notes: true
