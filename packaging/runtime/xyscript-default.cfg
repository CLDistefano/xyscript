# XyScript configuration (generated by SAVECFG)

# Editor text (foreground) colour -- R G B, 0-255
FGCOLOR 30 30 30

# Editor background colour -- R G B, 0-255
BGCOLOR 255 255 255

# UI chrome text colour -- R G B, 0-255
UIFGCOLOR 30 30 30

# UI chrome background colour -- R G B, 0-255
UIBGCOLOR 255 255 255

# Caret colour -- R G B, 0-255
CRCOLOR 220 40 40

# Command-line caret colour -- R G B, 0-255
CMCRCOLOR 220 40 40

# UI separator colour (panel rules + tab dividers) -- R G B, 0-255
SEPCOLOR 190 190 190

# Selection background colour -- R G B, 0-255
SELBGCOLOR 180 210 255

# Selected-text colour -- R G B, 0-255
SELFGCOLOR 20 20 20

# FIND highlight background colour -- R G B, 0-255
FINDBGCOLOR 250 230 90

# FIND-match text colour -- R G B, 0-255
FINDFGCOLOR 20 20 20

# Spelling underline colour -- R G B, 0-255
SPELLCOLOR 220 50 50

# Grammar underline colour -- R G B, 0-255
GRAMMARCOLOR 60 110 220

# Spelling underline style -- dotted|solid|squiggle
SPELLSTYLE dotted

# Grammar underline style -- dotted|solid|squiggle
GRAMMARSTYLE dotted

# Active split-pane border colour -- R G B, 0-255
PANECOLOR 70 130 240

# Language-check dialect
DIALECT american

# Spell-check engine -- harper | hunspell
SPELLENGINE harper

# Hunspell dictionaries (hunspell only; the -d value, e.g. en_US,de_DE)
# SPELLDICT en_US

# Hunspell executable (hunspell only; name on PATH or a full path)
# SPELLBIN hunspell

# UI translation catalog (LANG) -- path to a key=value strings file (default: built-in English)
# LANG path/to/catalog.lang

# Tab-title background -- R G B, 0-255
TABBGCOLOR active default

# Tab-title background -- R G B, 0-255
TABBGCOLOR hover default

# Tab-title background -- R G B, 0-255
TABBGCOLOR inactive default

# Tab close-× colour -- R G B, 0-255
TABXCOLOR default

# $CWD path text colour -- R G B, 0-255
PAFGCOLOR default

# $CWD path background colour -- R G B, 0-255
PABGCOLOR default

# Scratchpad text colour -- R G B, 0-255
SCRATCHFGCOLOR default

# Scratchpad background colour -- R G B, 0-255
SCRATCHBGCOLOR default

# TXT dialog text colour -- R G B, 0-255
TXTFGCOLOR 30 30 30

# TXT dialog background colour -- R G B, 0-255
TXTBGCOLOR 255 255 255

# Caret shape -- bar | block | underline
CRSHAPE bar

# Command-line caret shape -- bar | block | underline
CMCRSHAPE bar

# Command-line placement -- top | bottom | hidden
CMPLACE top

# Status-line placement -- top | bottom
STATUSLINE bottom

# Blank the command line after a command runs from it -- on | off
CMBLANK off

# Show the tab strip when only one file is open -- on | off
SHOWONETAB off

# Word-wrap long lines to the window -- on | off (off shows a horizontal scrollbar)
WRAP on

# Hanging indent for wrapped continuation rows, in spaces (0 = flush; ignored when WRAPINDENT is on)
WRAPHANG 0

# Default column width REFLOW hard-wraps to when given no width
REFLOWWIDTH 65

# Close the blank Untitled tab when a document is opened -- on | off
UNTITLEDTAB on

# Opening an already-open file switches to its tab instead of prompting -- on | off
GOTOOPEN off

# Bookmark gutter -- off | on (when bookmarked) | persist (always)
MARKGUTTER on

# Bookmark gutter dot colour -- R G B, 0-255
MARKFGCOLOR default

# Line-number gutter text colour -- R G B, 0-255
LNFGCOLOR default

# Line-number gutter background colour -- R G B, 0-255
LNBGCOLOR default

# MSG box header text colour -- R G B, 0-255
MSGHFGCOLOR default

# MSG box background colour -- R G B, 0-255
MSGBGCOLOR default

# MSG box OK-button text colour -- R G B, 0-255
MSGOKFGCOLOR default

# MSG box OK-button background colour -- R G B, 0-255
MSGOKBGCOLOR default

# Bookmark gutter background colour -- R G B, 0-255
MARKBGCOLOR default

# Reload a file automatically when changed on disk -- on | off
AUTOREOPEN off

# Log trappable + fatal errors to a file -- on | off
ERRORLOG off

# Error-log file path (default: xyscript-errors.log in $XSDIR)
# ERRORLOGFILE my-errors.log

# Dim the window when it loses focus -- on | off
DIMONBLUR off

# Close a tab back to the last-visited tab -- on | off
CLOSEBACK off

# Highlight URLs and Ctrl+click to open them -- on | off
URLHIGHLIGHT off

# URL highlight text colour -- R G B, 0-255
URLFGCOLOR default

# URL highlight background colour -- R G B, 0-255
URLBGCOLOR default

# Underline the spaces between words in MDA underline styling -- on | off
ULSPACES on

# Working-directory path placement -- cmline | status
PAPLACE status

# Working-directory path -- max display width in characters
PATHLEN 45

# Auto-enable highlighting for recognized file types -- on | off
HLAUTO off

# UI zoom factor (whole-window scale)
UISCALE 1

# Chrome (menu/status/command-line) font size, points
UIFONT 14

# Editor text font size, points
EDFONT 22

# Editor font family (monospaced; EDFAMILY; 'default' = built-in)
EDFAMILY default

# Editor font style -- normal | bold | italic | bolditalic
EDSTYLE normal

# UI chrome font family (UIFAMILY; 'default' = built-in)
UIFAMILY default

# UI chrome font style -- normal | bold | italic | bolditalic
UISTYLE normal

# TXT dialog text size, points
TXTFONT 14

# TXT dialog zoom factor
TXTSCALE 1

# TXT window font family (TXTFAMILY; 'default' = built-in)
TXTFAMILY default

# TXT window font style -- normal | bold | italic | bolditalic
TXTSTYLE normal

# DIR-window text colour -- R G B, 0-255
DWFGCOLOR default

# DIR-window background colour -- R G B, 0-255
DWBGCOLOR default

# DIR-window text size, points (default: inherits the editor font)
# DWFONT 14

# DIR-window zoom factor
DWSCALE 1

# DIR-window font family (DWFAMILY; 'default' = built-in)
DWFAMILY default

# DIR-window font style -- default | normal | bold | italic | bolditalic ('default' inherits the editor)
DWSTYLE default

# Markdown Preview/TOPDF body font (PVFAMILY; 'default' = built-in)
PVFAMILY default

# Markdown Preview/TOPDF body size, points (PVSIZE; default: built-in)
# PVSIZE 11

# Markdown Preview/TOPDF code font (PVCODE; 'default' = built-in)
PVCODE default

# Markdown Preview/TOPDF code size, points (PVCODESIZE; default: inherit body size)
# PVCODESIZE 10

# Preview/TOPDF page margin -- left
PVMARGINL 1in

# Preview/TOPDF page margin -- right
PVMARGINR 1in

# Preview/TOPDF page margin -- top
PVMARGINT 1in

# Preview/TOPDF page margin -- bottom
PVMARGINB 1in

# Preview/TOPDF page format (letter/legal/tabloid/a4/a5/a6)
PVPAPER letter

# Preview/TOPDF line spacing (em/pt/cm/mm/in; 'default' = Typst 0.65em)
PVLEADING default

# Preview/TOPDF extra space between paragraphs ('default' = Typst 1.2em)
PVSPACING default

# Preview/TOPDF page numbers (pattern like '1', 'Page 1', '1 of 1'; 'off' = none)
PVPAGENUM off

# Preview/TOPDF page-number position (e.g. bottom-center, top-right)
PVPAGEPOS bottom-center

# Preview/TOPDF justify body text (on/off)
PVJUSTIFY on

# Preview/TOPDF first-line paragraph indent ('off' = none)
PVINDENT off

# Preview/TOPDF page header ('|' = left/center/right; {date} {file} {page} {pages}; 'off' = none)
PVHEADER off

# Preview/TOPDF page footer ('|' = left/center/right; {date} {file} {page} {pages}; 'off' = none)
PVFOOTER off

# Line spacing, percent of the editor font
LSP 145

# Left margin (offset), character columns
OFL 0

# Right margin (offset), character columns
OFR 0

# Menu bar -- SMB shows it, CMB hides it
SMB

# Visible paragraph marks ¶ -- SVR on, CVR off
CVR

# Visible whitespace (space dots / tab arrows) -- SWS on, CWS off
CWS

# Line-number gutter -- SLN on, CLN off
CLN

# Pop-up command line -- SGC on, CGC off
CGC

# Shell-output tab visibility -- SW on/off
SW on

# Console prompt template (SHPROMPT; $CWD expands at display; quotes keep spaces)
SHPROMPT "$CWD> "

# Colour Console output from ANSI codes -- on | off
ANSICOLOR on

# Preview pane visibility -- PV on/off
PV off

# Persistent selection -- SPS on, CPS off
CPS

# OS window title bar -- on shows it, off uses a draggable strip
TITLEBAR on

# Remember window size+position across runs -- off helps mixed-DPI multi-monitor setups
WINGEO on

# Auto-save-and-restore the open tabs across runs (Notepad++-style)
SESSION off

# Open a file from a DIR listing in a new tab (on) or in place (off) -- DIRNW
DIRNW off

# Open a file from the DIR/W window in a new tab (on) or the active tab (off) -- DIRWNW
DIRWNW on

# Close the DIR/W window after opening a file (on) or keep it open (off) -- DIRWCLOSE
DIRWCLOSE off

# Reuse an already-open DIR listing tab (on) or open a new one per DIR (off) -- DIRRT
DIRRT off

# GREP leading context lines -- GREPBEFORE
GREPBEFORE 0

# GREP trailing context lines -- GREPAFTER
GREPAFTER 0

# Blank line between GREP result groups (on|off) -- GREPBLANK
GREPBLANK off

# Default DIR sort/filter/view switches -- DIRSET (default: none)
# DIRSET /on /p

# Autosave interval, seconds (off = disabled)
AUTOSAVE off

# Tab width, spaces
TB 4

# Soft tabs -- insert spaces for tabs
TABSPACES off

# Auto-indent new lines on Enter
TABINDENT off

# Highlight matching brackets
BALPAIRS off

# Auto-close typed bracket/quote pairs
TYPEPAIRS off

# Hanging indent for soft-wrapped lines
WRAPINDENT off

# Matched-bracket highlight colour -- R G B, 0-255
BALPAIRSCOLOR default

# EMPH emphasis text colour -- R G B, 0-255
EMPHFGCOLOR default

# EMPH emphasis background colour -- R G B, 0-255
EMPHBGCOLOR default

# Fixed decimal places for float display (default: full precision)
# DECIMALS 2

